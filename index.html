
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪だるまAR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam;">

        <a-marker preset="hiro">

            <a-sphere
                position="0 0.35 0"
                radius="0.35"
                color="white">
            </a-sphere>

            <a-sphere
                position="0 0.82 0"
                radius="0.25"
                color="white">
            </a-sphere>

            <a-sphere
                position="0 1.17 0"
                radius="0.18"
                color="white">
            </a-sphere>

            <a-sphere
                position="-0.07 1.21 0.15"
                radius="0.025"
                color="black">
            </a-sphere>

            <a-sphere
                position="0.07 1.21 0.15"
                radius="0.025"
                color="black">
            </a-sphere>

            <a-cone
                position="0 1.15 0.19"
                radius-bottom="0.035"
                radius-top="0.005"
                height="0.15"
                rotation="90 0 0"
                color="orange">
            </a-cone>

            <a-cylinder
                position="0 1.35 0"
                radius="0.22"
                height="0.04"
                color="black">
            </a-cylinder>

            <a-cylinder
                position="0 1.46 0"
                radius="0.13"
                height="0.20"
                color="black">
            </a-cylinder>

            <a-sphere position="0 0.78 0.24"
                radius="0.035" color="black"></a-sphere>
            <a-sphere position="0 0.88 0.23"
                radius="0.035" color="black"></a-sphere>
            <a-sphere position="0 0.68 0.23"
                radius="0.035" color="black"></a-sphere>

        </a-marker>

        <a-marker preset="kanji">
            <a-box
                position="0 0.5 0"
                color="skyblue">
            </a-box>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
